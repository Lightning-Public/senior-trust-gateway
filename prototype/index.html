<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f7" />
    <meta name="description" content="시니어 AI 생활매니저 — 안심부터 시작하는 시니어 디지털 동행" />
    <link rel="stylesheet" href="/src/product-design.css" />
    <style>
      .app-header {
        position: sticky;
        top: 0;
        z-index: 60;
        padding: 10px 0;
        background: rgba(243, 245, 247, 0.96);
        backdrop-filter: blur(10px);
      }

      .brand-lockup[role='link'] {
        cursor: pointer;
        border-radius: 14px;
      }

      .brand-lockup[role='link']:focus-visible {
        outline: 4px solid rgba(25, 83, 194, 0.3);
        outline-offset: 4px;
      }
    </style>
    <title>시니어 AI 생활매니저</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const brand = document.querySelector('.brand-lockup')
        if (!brand) return

        const goHome = () => {
          if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname + window.location.search)
          }
          window.scrollTo({ top: 0, behavior: 'smooth' })
        }

        brand.setAttribute('role', 'link')
        brand.setAttribute('tabindex', '0')
        brand.setAttribute('aria-label', '시니어 AI 생활매니저 홈으로 이동')
        brand.addEventListener('click', goHome)
        brand.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault()
            goHome()
          }
        })
      })
    </script>
  </body>
</html>
